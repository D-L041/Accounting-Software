services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: precious_schoolbooks
      POSTGRES_USER: precious
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - precious_schoolbooks_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precious -d precious_schoolbooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      SECRET_KEY: local-only-development-secret-change-before-deployment
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://precious:local-only-password@db:5432/precious_schoolbooks
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  precious_schoolbooks_db:
